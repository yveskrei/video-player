[project]
name = "video-library-wrapper"
version = "0.1.0"
description = "Idiomatic Python example host for libclient_video.so (ctypes)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_library"]
