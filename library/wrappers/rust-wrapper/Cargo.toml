[package]
name = "rust-wrapper"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_wrapper"
path = "src/lib.rs"

[[bin]]
name = "rust-wrapper"
path = "src/main.rs"

[dependencies]
libloading = "0.8"
libc = "0.2"
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
